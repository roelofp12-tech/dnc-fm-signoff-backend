<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign-off</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f4f5f7;color:#1b1f24;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:8px 0 2px}
.sub{color:#5b6470;font-size:13px;margin:0 0 12px}
.card{background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:16px;margin-bottom:14px}
.r{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;border-bottom:1px solid #eef0f3}
.r span:first-child{color:#5b6470;flex:0 0 38%}.r span:last-child{text-align:right;white-space:pre-line}
label{display:block;font-size:13px;color:#5b6470;margin:12px 0 4px}
input{width:100%;font:inherit;padding:10px;border:1px solid #c8ced6;border-radius:8px}
canvas{width:100%;height:150px;border:1px dashed #8a93a0;border-radius:8px;background:#fff;touch-action:none;display:block}
button,a.btn{font:inherit;padding:12px 14px;border-radius:8px;border:1px solid #1b1f24;background:#1b1f24;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
button.sec,a.btn.sec{background:#fff;color:#1b1f24;border-color:#c8ced6}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1;text-align:center}
.err{color:#b3261e;font-size:13px;min-height:18px;margin:6px 0 0}
.ok{background:#dff3e6;color:#16623a;border-radius:8px;padding:10px 12px;font-size:14px}
.warn{background:#fdf1d8;color:#7a5200;border-radius:8px;padding:10px 12px;font-size:14px}
</style>
</head>
<body>
<main>
<h1 id="ttl">Loading…</h1>
<p class="sub" id="sub"></p>
<div id="body"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/common.js"></script>
<script>
var token=location.pathname.split('/').filter(Boolean).pop();
var body=document.getElementById('body'),ttl=document.getElementById('ttl'),sub=document.getElementById('sub');
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;}
function summary(r){var c=el('div','card');(r.fields||[]).forEach(function(f){var row=el('div','r');row.appendChild(el('span','',f[0]));row.appendChild(el('span','',f[1]||'-'));c.appendChild(row);});return c;}
function showSigned(r,msg){
 body.textContent='';
 body.appendChild(el('div','ok',msg));
 var c=summary(r);body.insertBefore(c,null);
 var wa=el('a','btn','Send signed copy to Roelof on WhatsApp');wa.style.cssText='margin-top:10px;display:block;text-align:center;background:#1f8f4e;border-color:#1f8f4e';wa.target='_blank';wa.rel='noopener';
 wa.href='https://wa.me/27737640256?text='+encodeURIComponent('Signed: '+r.formLabel+' ('+r.id+') by '+r.signed.name+' on '+fmt(r.signed.at)+'.\n'+location.href);
 var lk=el('a','btn sec','');lk.hidden=true;lk.target='_blank';
 var b=el('button','','Download signed PDF');b.style.marginTop='10px';b.style.width='100%';
 b.onclick=function(){savePdf(r,lk);lk.style.marginTop='8px';};
 body.appendChild(b);body.appendChild(lk);body.appendChild(wa);
}
fetch('/api/sign/'+token).then(function(x){return x.json().then(function(j){if(!x.ok)throw new Error(j.error);return j;});}).then(function(r){
 ttl.textContent=r.formLabel+' sign-off';
 sub.textContent='Hi '+(r.approverName||'')+'. Check the details, then sign below.';
 if(r.status==='signed'){showSigned(r,'This was already signed by '+r.signed.name+' on '+fmt(r.signed.at)+'. Nothing more to do.');return;}
 body.appendChild(summary(r));
 var c=el('div','card');
 c.appendChild(el('label','','Your name'));
 var nm=el('input');nm.placeholder='Full name';nm.value=(r.approverName||'').replace(' (test)','');c.appendChild(nm);
 c.appendChild(el('label','','Sign with your finger'));
 var cv=el('canvas');c.appendChild(cv);
 var er=el('p','err','');c.appendChild(er);
 var row=el('div','row');var cl=el('button','sec','Clear');var ap=el('button','','Approve and sign');
 row.appendChild(cl);row.appendChild(ap);c.appendChild(row);body.appendChild(c);
 var cx,dr=false,dirty=false;
 var rect=cv.getBoundingClientRect();cv.width=rect.width*2;cv.height=rect.height*2;cx=cv.getContext('2d');cx.scale(2,2);cx.lineWidth=2.2;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#111';
 function pos(e){var q=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-q.left,t.clientY-q.top];}
 function dn(e){e.preventDefault();dr=true;var p=pos(e);cx.beginPath();cx.moveTo(p[0],p[1]);}
 function mv(e){if(!dr)return;e.preventDefault();var p=pos(e);cx.lineTo(p[0],p[1]);cx.stroke();dirty=true;er.textContent='';}
 function up(){dr=false;}
 ['mousedown','touchstart'].forEach(function(n){cv.addEventListener(n,dn,{passive:false});});
 ['mousemove','touchmove'].forEach(function(n){cv.addEventListener(n,mv,{passive:false});});
 ['mouseup','mouseleave','touchend'].forEach(function(n){cv.addEventListener(n,up);});
 cl.onclick=function(){cx.clearRect(0,0,cv.width,cv.height);dirty=false;};
 ap.onclick=function(){
  if(!nm.value.trim()){er.textContent='Enter your name first';return;}
  if(!dirty){er.textContent='Draw your signature first';return;}
  ap.disabled=true;ap.textContent='Saving…';
  fetch('/api/sign/'+token,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:nm.value.trim(),signature:cv.toDataURL('image/png')})})
  .then(function(x){return x.json().then(function(j){return[x.status,j];});})
  .then(function(a){var s=a[0],j=a[1];
   if(s===409){showSigned(j,'Someone already signed this: '+j.signed.name+' on '+fmt(j.signed.at)+'. Nothing more to do.');return;}
   if(s>=400){er.textContent=j.error||'Something went wrong';ap.disabled=false;ap.textContent='Approve and sign';return;}
   showSigned(j,'Thank you. Your sign-off has been saved.');})
  .catch(function(){er.textContent='No connection. Try again.';ap.disabled=false;ap.textContent='Approve and sign';});
 };
}).catch(function(e){ttl.textContent='Link problem';body.appendChild(el('div','warn',e.message||'This link isn\'t valid.'));});
</script>
</body>
</html>
